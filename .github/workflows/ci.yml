name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: cp .env.example .env
      - run: ./buddy key:generate
      - run: ./buddy lint
      - run: ./buddy typecheck
      - run: bun run typecheck:runtime
      - run: bun run typecheck:views
      - run: ./buddy build:docs
      - run: test -f dist/docs/.bunpress/index.html
      - run: bun run roadmap:check
      - run: bun run parity:check
      - run: python3 -m py_compile resources/functions/drone/camera/imx500_worker.py
      - run: python3 -m unittest discover -s tests/hardware
      - name: Verify a kernel-confirmed full input pipe on Linux
        run: bun test tests/unit/runtime.test.ts --test-name-pattern 'kernel-confirmed full input FIFO'
      - name: Verify an actual partial host image write and fresh-process recovery
        env:
          RUNTIME_HOST_FILE_LIMIT_EVIDENCE: ${{ runner.temp }}/runtime-host-file-limit-evidence
        run: bun test tests/unit/updates-host-writes.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-host-file-limit-evidence
          if-no-files-found: ignore
          retention-days: 7
          path: ${{ runner.temp }}/runtime-host-file-limit-evidence
      - name: Verify explicit maintenance handoff interruption and fresh-process recovery
        env:
          RUNTIME_MAINTENANCE_EVIDENCE: ${{ runner.temp }}/runtime-maintenance-evidence
        run: bun test tests/unit/updates-maintenance-cuts.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-maintenance-evidence
          if-no-files-found: ignore
          retention-days: 7
          path: ${{ runner.temp }}/runtime-maintenance-evidence
      - run: ./buddy test
        env:
          RUNTIME_HOST_FILE_LIMIT_EVIDENCE: ${{ runner.temp }}/runtime-host-file-limit-full-evidence
          RUNTIME_MAINTENANCE_EVIDENCE: ${{ runner.temp }}/runtime-maintenance-full-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-host-file-limit-full-evidence
          if-no-files-found: ignore
          retention-days: 7
          path: ${{ runner.temp }}/runtime-host-file-limit-full-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-maintenance-full-evidence
          if-no-files-found: ignore
          retention-days: 7
          path: ${{ runner.temp }}/runtime-maintenance-full-evidence
      - run: bun run runtime:cli
      - name: Verify signed test-image staging through the portable CLI outside the checkout
        run: bun tests/fixtures/updates/qualify.ts "$RUNNER_TEMP/runtime-update-qualification" "$GITHUB_WORKSPACE/storage/runtime-build/cli/drone"
      - name: Verify protected initial trust through a copied standalone CLI
        run: bun tests/fixtures/updates/qualify-trust.ts "$RUNNER_TEMP/runtime-trust-qualification" "$GITHUB_WORKSPACE/storage/runtime-build/cli/drone"
      - name: Verify typed SDK failures in a minified copied standalone executable
        run: bun tests/fixtures/updates/qualify-sdk.ts "$RUNNER_TEMP/runtime-sdk-qualification"
      - name: Verify persistent metadata and recovery with a copied standalone CLI
        run: bun tests/fixtures/updates/qualify-store.ts "$RUNNER_TEMP/runtime-store-qualification" "$GITHUB_WORKSPACE/storage/runtime-build/cli/drone"
      - name: Verify protected signed-image preparation with a copied standalone CLI
        run: bun tests/fixtures/updates/qualify-preparation.ts "$RUNNER_TEMP/runtime-preparation-qualification" "$GITHUB_WORKSPACE/storage/runtime-build/cli/drone"
      - name: Verify owned candidate identity and retirement with a copied standalone CLI
        run: bun tests/fixtures/updates/qualify-candidates.ts "$RUNNER_TEMP/runtime-candidates-qualification" "$GITHUB_WORKSPACE/storage/runtime-build/cli/drone"
      - name: Verify host slots, observed health and interrupted recovery with a copied standalone CLI
        run: bun tests/fixtures/updates/qualify-host-slots.ts "$RUNNER_TEMP/runtime-host-slots-qualification" "$GITHUB_WORKSPACE/storage/runtime-build/cli/drone" "$GITHUB_WORKSPACE"
      - name: Verify explicit maintenance and format-4 runtime health through a copied CLI
        run: bun tests/fixtures/updates/qualify-maintenance.ts "$RUNNER_TEMP/runtime-maintenance-cli" "$GITHUB_WORKSPACE/storage/runtime-build/cli/drone"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-maintenance-cli-evidence
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
          path: |
            ${{ runner.temp }}/runtime-maintenance-cli
            !${{ runner.temp }}/runtime-maintenance-cli/drone
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-host-slots-evidence
          if-no-files-found: ignore
          retention-days: 7
          path: ${{ runner.temp }}/runtime-host-slots-qualification
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone runtime:bench --project "$GITHUB_WORKSPACE" --ticks 100 --fault deadline
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone sensors:replay "$GITHUB_WORKSPACE/tests/fixtures/sensors/bench-v1.json" --at-ms 500
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone estimator:replay "$GITHUB_WORKSPACE/tests/fixtures/estimation/motion-v1.json" --at-ms 6040
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone controls:simulate --scenario hover --seconds 3
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone authority:simulate --scenario pi-loss --seconds 4
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone drivers:bench --driver ardupilot --drop-first-ack
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone drivers:bench --driver px4 --signed --drop-first-ack
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone payloads:bench
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone payloads:capture --driver replay --output "$RUNNER_TEMP/payload-capture"
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone diagnostics:record --project "$GITHUB_WORKSPACE" --ticks 20 --fault deadline --output "$RUNNER_TEMP/runtime-recording"
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone diagnostics:replay "$RUNNER_TEMP/runtime-recording/journal.ndjson"
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone diagnostics:export "$RUNNER_TEMP/runtime-recording/journal.ndjson" --output "$RUNNER_TEMP/runtime-export"
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone missions:validate "$GITHUB_WORKSPACE/examples/local-mission.json"
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone missions:simulate --scenario recovery --output "$RUNNER_TEMP/mission-recording"
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone missions:replay "$RUNNER_TEMP/mission-recording/mission.json" --at-ms 6000
        working-directory: ${{ runner.temp }}
      - name: Exercise portable mission-process recovery outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          "$GITHUB_WORKSPACE/storage/runtime-build/cli/drone" missions:checkpoint "$RUNNER_TEMP/mission-recording/mission.json" --at-ms 4980 --output "$RUNNER_TEMP/mission-checkpoint"
          bun -e 'const root = process.env.RUNNER_TEMP; const trace = await Bun.file(`${root}/mission-recording/mission.json`).json(); const observation = trace.rows.find(row => row.observation.nowMs === 6000).observation; await Bun.write(`${root}/mission-observation.json`, JSON.stringify(observation))'
          "$GITHUB_WORKSPACE/storage/runtime-build/cli/drone" missions:recover "$RUNNER_TEMP/mission-checkpoint/mission.json" "$RUNNER_TEMP/mission-observation.json" --output "$RUNNER_TEMP/mission-recovered"
          "$GITHUB_WORKSPACE/storage/runtime-build/cli/drone" missions:replay "$RUNNER_TEMP/mission-recovered/mission.json"
          bun -e 'const root = process.env.RUNNER_TEMP; const trace = await Bun.file(`${root}/mission-recording/mission.json`).json(); const observation = trace.rows.find(row => row.observation.nowMs === 6020).observation; await Bun.write(`${root}/mission-resume-observation.json`, JSON.stringify(observation))'
          "$GITHUB_WORKSPACE/storage/runtime-build/cli/drone" missions:resume "$RUNNER_TEMP/mission-recovered/mission.json" "$RUNNER_TEMP/mission-resume-observation.json" --output "$RUNNER_TEMP/mission-resumed"
          "$GITHUB_WORKSPACE/storage/runtime-build/cli/drone" missions:replay "$RUNNER_TEMP/mission-resumed/mission.json"
      - name: Exercise portable v2 missions outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          for profile in fixed-wing ground surface subsea; do
            root="$RUNNER_TEMP/mission-$profile"
            binary="$GITHUB_WORKSPACE/storage/runtime-build/cli/drone"
            "$binary" missions:simulate --profile "$profile" --seconds 180 --output "$root-source"
            bun -e 'const root = process.argv[1]; const trace = await Bun.file(`${root}-source/mission.json`).json(); await Bun.write(`${root}-epoch.txt`, String(trace.rows[10].observation.nowMs)); await Bun.write(`${root}-recover.json`, JSON.stringify(trace.rows[20].observation)); await Bun.write(`${root}-resume.json`, JSON.stringify(trace.rows[21].observation))' "$root"
            "$binary" missions:checkpoint "$root-source/mission.json" --at-ms "$(cat "$root-epoch.txt")" --output "$root-checkpoint"
            "$binary" missions:recover "$root-checkpoint/mission.json" "$root-recover.json" --output "$root-recovered"
            "$binary" missions:resume "$root-recovered/mission.json" "$root-resume.json" --output "$root-resumed"
            "$binary" missions:replay "$root-resumed/mission.json"
          done
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone navigation:simulate --scenario avoid-land
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone navigation:simulate --scenario replan
        working-directory: ${{ runner.temp }}
      - name: Record and replay finite patrols outside the checkout
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          binary="$GITHUB_WORKSPACE/storage/runtime-build/cli/drone"
          "$binary" patrol:simulate --output "$RUNNER_TEMP/patrol-neutral" | bun -e 'const text = await Bun.stdin.text(); const summary = JSON.parse(text); if (text !== await Bun.file(`${process.env.RUNNER_TEMP}/patrol-neutral/summary.json`).text() || summary.status !== "neutral-preview" || summary.physicalFlightEnabled !== false) throw new Error("Invalid neutral patrol recording")'
          "$binary" patrol:replay "$RUNNER_TEMP/patrol-neutral" | bun -e 'const result = await Bun.stdin.json(); if (result.verified !== true || result.comparison !== "exact-compact-summary-json" || result.authentication !== "unsigned-consistency" || result.runtimeStateRestored !== false || result.fullTraceVerified !== false || result.physicalFlightEnabled !== false || result.summary.status !== "neutral-preview") throw new Error("Invalid neutral patrol replay")'
          "$binary" patrol:simulate --decisions "$GITHUB_WORKSPACE/examples/patrol-decisions.json" --unsigned-local-review --enable-charge --output "$RUNNER_TEMP/patrol-approved" | bun -e 'const text = await Bun.stdin.text(); const summary = JSON.parse(text); if (text !== await Bun.file(`${process.env.RUNNER_TEMP}/patrol-approved/summary.json`).text() || summary.status !== "completed" || summary.flights.length !== 2 || summary.physicalFlightEnabled !== false) throw new Error("Invalid approved patrol recording")'
          "$binary" patrol:replay "$RUNNER_TEMP/patrol-approved" --unsigned-local-review --enable-charge | bun -e 'const result = await Bun.stdin.json(); if (result.verified !== true || result.comparison !== "exact-compact-summary-json" || result.authentication !== "unsigned-consistency" || result.runtimeStateRestored !== false || result.fullTraceVerified !== false || result.physicalFlightEnabled !== false || result.summary.status !== "completed" || result.summary.flights.length !== 2) throw new Error("Invalid approved patrol replay")'
      - name: Qualify compiled cargo characterization outside the checkout
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          binary="$GITHUB_WORKSPACE/storage/runtime-build/cli/drone"
          for scenario in centered-carried forward-carried forward-separated link-loss; do
            expected=0
            if [ "$scenario" = link-loss ]; then expected=1; fi
            actual=0
            "$binary" cargo:load-bench --scenario "$scenario" > "$RUNNER_TEMP/cargo-$scenario.json" || actual=$?
            test "$actual" -eq "$expected"
            bun -e 'const [file, scenario] = process.argv.slice(1); const raw = await Bun.file(file).text(); const s = JSON.parse(raw); if (Buffer.byteLength(raw) > 16384 || s.scenario !== scenario || s.status !== (scenario === "link-loss" ? "unqualified" : "characterized") || s.physicalFlightEnabled !== false || s.boardOutputsInhibited !== true || Object.values(s.capabilities).some(Boolean) || s.final.landingPerformed !== false) throw new Error("Invalid compiled cargo characterization")' "$RUNNER_TEMP/cargo-$scenario.json" "$scenario"
          done
      - name: Qualify compiled environmental datasets outside the checkout
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          binary="$GITHUB_WORKSPACE/storage/runtime-build/cli/drone"
          for profile in nominal sensor-loss site-closure; do
            directory="$RUNNER_TEMP/environment-$profile"
            "$binary" environment:simulate --profile "$profile" --output "$directory" > "$RUNNER_TEMP/environment-$profile.json"
            bun -e 'const [file, directory, profile] = process.argv.slice(1); const raw = await Bun.file(file).text(); const s = JSON.parse(raw); const mraw = await Bun.file(`${directory}/manifest.json`).text(); const m = JSON.parse(mraw); const digest = value => new Bun.CryptoHasher("sha256").update(value).digest("hex"); if (Buffer.byteLength(raw) > 16384 || s.profile !== profile || s.qualified !== true || s.physicalFlightEnabled !== false || s.nativeMissionState !== (profile === "nominal" ? "completed" : "aborted") || s.dataset.files !== 5 || s.dataset.manifestSha256 !== digest(mraw) || m.summary.dataset !== null || m.contentAuthentication !== "unsigned-content-hashes") throw new Error("Invalid compiled environment dataset"); let bytes = Buffer.byteLength(mraw); for (const f of m.files) { const data = await Bun.file(`${directory}/${f.path}`).arrayBuffer(); if (data.byteLength !== f.byteLength || digest(data) !== f.sha256) throw new Error("Changed compiled environment content"); bytes += data.byteLength; } if (bytes !== s.dataset.bytes || bytes > 16777216) throw new Error("Invalid compiled environment byte accounting")' "$RUNNER_TEMP/environment-$profile.json" "$directory" "$profile"
            "$binary" missions:replay "$directory/mission.json"
          done
      - name: Qualify compiled cinema outcomes outside the checkout
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          binary="$GITHUB_WORKSPACE/storage/runtime-build/cli/drone"
          for scenario in nominal body-disturbance target-loss mechanical-limit camera-loss wrong-ack rc-override; do
            expected=1
            case "$scenario" in nominal|body-disturbance) expected=0 ;; esac
            actual=0
            "$binary" cinema:simulate --scenario "$scenario" > "$RUNNER_TEMP/cinema-$scenario.json" || actual=$?
            test "$actual" -eq "$expected"
            bun -e 'const [file, scenario, expected] = process.argv.slice(1); const raw = await Bun.file(file).text(); const s = JSON.parse(raw); if (Buffer.byteLength(raw) > 16384 || s.scenario !== scenario || s.status !== (expected === "0" ? "completed" : "halted") || s.physicalFlightEnabled !== false || s.physicalGimbalActuationEnabled !== false || s.identityAuthenticated !== false || s.mission.boardNeutral !== true || expected === "0" && (s.captures.length !== 3 || s.captures.some(c => c.state !== "confirmed" || c.postStepAdmission !== "valid" || c.quality.qualified !== true))) throw new Error("Invalid compiled cinema outcome")' "$RUNNER_TEMP/cinema-$scenario.json" "$scenario" "$expected"
          done
      - name: Qualify compiled counted Cinema summaries outside the checkout
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          binary="$GITHUB_WORKSPACE/storage/runtime-build/cli/drone"
          for scenario in nominal source-expiry-with-foreign; do
            expected=0
            if [ "$scenario" = source-expiry-with-foreign ]; then expected=1; fi
            actual=0
            "$binary" cinema:translate --scenario "$scenario" > "$RUNNER_TEMP/cinema-counted-$scenario.json" 2> "$RUNNER_TEMP/cinema-counted-$scenario.stderr" || actual=$?
            test "$actual" -eq "$expected"
            test ! -s "$RUNNER_TEMP/cinema-counted-$scenario.stderr"
            bun -e 'const [file, scenario] = process.argv.slice(1); const raw = await Bun.file(file).text(); const s = JSON.parse(raw); if (Buffer.byteLength(raw) > 16384 || !raw.endsWith("\n") || raw.split("\n").length !== 2 || s.version !== 1 || s.evidence !== "owned-counted-cinema-cli-summary" || s.run.version !== 4 || s.run.scenario !== scenario || s.translation.version !== 3 || s.mission.version !== 4 || s.encoderMethod.method !== "count-difference-v1" || s.run.physicalFlightEnabled !== false || s.run.physicalGimbalActuationEnabled !== false || s.run.identityAuthenticated !== false || s.mission.boardNeutral !== true || s.translation.smoothnessQualified !== false) throw new Error("Invalid compiled counted Cinema summary"); if (scenario === "nominal") { if (s.run.status !== "completed" || s.run.reason !== "qualified" || s.mission.state !== "completed" || s.mission.reason !== "landed" || s.evaluation.qualified !== true || s.translation.metrics.nominalWitness !== "satisfied" || s.translation.metrics.captureForwardDisplacementM < 0.5 || s.translation.metrics.captureForwardSpeedMps.some(v => v <= 0) || s.captures.length !== 3 || s.captures.some(c => c.state !== "confirmed" || c.postStepAdmission !== "valid" || c.quality.qualified !== true)) throw new Error("Invalid compiled counted Cinema nominal"); } else if (s.run.status !== "halted" || s.run.reason !== "gimbal-source-expired" || s.mission.state !== "aborted" || s.mission.reason !== "operator-abort" || s.evaluation.qualified !== false || s.translation.metrics.sourceMotionWitness !== "satisfied" || s.translation.metrics.firstExposureForwardDisplacementM <= 0 || s.translation.metrics.firstExposureForwardSpeedMps <= 0 || s.captures.length !== 1 || s.captures[0].state !== "uncertain" || s.captures[0].reason !== "gimbal-source-expired" || s.captures[0].acknowledgedAtMs !== null || s.captures[0].receivedAtMs !== null) throw new Error("Invalid compiled counted Cinema source expiry")' "$RUNNER_TEMP/cinema-counted-$scenario.json" "$scenario"
          done
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone antenna:bench --scenario nominal --seconds 10
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone air:simulate --scenario nominal --seconds 120
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone ground:simulate --scenario logistics --seconds 120
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone surface:simulate --scenario nominal --seconds 120 --survey "$RUNNER_TEMP/surface-survey.json" --position-sigma 1 --clock-sigma 2 --attitude-sigma 0.002
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone subsea:simulate --scenario nominal --seconds 120 --inspection "$RUNNER_TEMP/subsea-inspection.json"
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone subsea:simulate --scenario tether-loss --seconds 120
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone vision:validate "$GITHUB_WORKSPACE/examples/vision-calibration.json"
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone vision:simulate --scenario follow
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone vision:simulate --scenario identity-drift
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone mapping:plan --config "$GITHUB_WORKSPACE/examples/survey.json"
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone mapping:simulate --scenario nominal --output "$RUNNER_TEMP/mapping-dataset"
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone mapping:simulate --scenario crosshatch
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone mapping:simulate --scenario camera-loss
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone volumes:demo --scenario reference-comparison --output "$RUNNER_TEMP/volume-pyramid"
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone volumes:process "$GITHUB_WORKSPACE/examples/stockpile/request.json"
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone volumes:import "$GITHUB_WORKSPACE/examples/stockpile/surface.asc" --format asc --metadata "$GITHUB_WORKSPACE/examples/stockpile/metadata.json" --measurement "$GITHUB_WORKSPACE/examples/stockpile/measurement.json" --output "$RUNNER_TEMP/volume-grid"
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone inspection:plan "$GITHUB_WORKSPACE/examples/inspection.json"
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone inspection:simulate --visit before --output "$RUNNER_TEMP/inspection-before"
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone inspection:simulate --scenario wind --visit after --output "$RUNNER_TEMP/inspection-after"
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone inspection:compare "$RUNNER_TEMP/inspection-before/recording.json" "$RUNNER_TEMP/inspection-after/recording.json"
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone inspection:review "$RUNNER_TEMP/inspection-before/recording.json" --id ci-review --capture capture-0001 --reviewer ci-operator --reviewed-at 2026-10-18T12:00:00.000Z --decision needs-follow-up --modality thermal --x 48 --y 36 --note "Synthetic CI declaration, no human defect verification" --output "$RUNNER_TEMP/inspection-reviewed"
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone inspection:simulate --scenario structure-motion
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone agriculture:plan "$GITHUB_WORKSPACE/examples/agriculture.json"
        working-directory: ${{ runner.temp }}
      - name: Qualify the explicit farming planning wire with a copied standalone CLI
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          attempt="$(mktemp -d "$RUNNER_TEMP/farming-plan.XXXXXX")"
          cp "$GITHUB_WORKSPACE/storage/runtime-build/cli/drone" "$attempt/drone"
          cmp "$GITHUB_WORKSPACE/storage/runtime-build/cli/drone" "$attempt/drone"
          cp "$GITHUB_WORKSPACE/examples/farming-plan.json" "$attempt/request.json"
          cd "$attempt"
          printf '%s\n' '3089a663542e7472ff22cc115e606344f431c2e2d7de39f27edabb3a7f5fa5f0  request.json' | sha256sum -c -
          ./drone farming:plan request.json > result.json 2> result.stderr
          test ! -s result.stderr
          bun -e 'const raw = await Bun.file("result.json").text(); if (Buffer.byteLength(raw) > 524288 || raw.split("\n").length !== 2 || !raw.endsWith("\n")) throw new Error("Invalid farming wire"); const p = JSON.parse(raw); const area = p.plan.survey.areaM2; if (p.version !== 1 || p.kind !== "farming-observation-planning-preview" || p.status !== "planned" || p.source.sha256 !== "3089a663542e7472ff22cc115e606344f431c2e2d7de39f27edabb3a7f5fa5f0" || p.source.byteLength !== 4745 || p.plan.survey.lanes.length !== 5 || typeof area !== "number" || !Number.isFinite(area) || Math.abs(area - 2.56) > 64 * Number.EPSILON * 2.56 || [p.ownershipVerified,p.geometryVerified,p.physicalFlightEnabled,p.observationPerformed,p.dispatchPerformed].some(v => v !== false)) throw new Error("Invalid farming preview")'
          printf '%s\n' '{"version":1}' > invalid.json
          if ./drone farming:plan invalid.json > invalid.stdout 2> invalid.stderr; then exit 1; fi
          test ! -s invalid.stdout
          printf '%s\n' 'Farming planning preview unavailable: invalid declaration, rejected plan or output failure' > expected.stderr
          cmp expected.stderr invalid.stderr
          if ./drone farming:plan > missing.stdout 2> missing.stderr; then exit 1; fi
          test ! -s missing.stdout
      - name: Qualify source-bound collection with a copied standalone CLI
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          attempt="$(mktemp -d "$RUNNER_TEMP/farming-collect.XXXXXX")"
          cp "$GITHUB_WORKSPACE/storage/runtime-build/cli/drone" "$attempt/drone"
          cmp "$GITHUB_WORKSPACE/storage/runtime-build/cli/drone" "$attempt/drone"
          cp "$GITHUB_WORKSPACE/examples/farming-collection.json" "$attempt/request.json"
          cd "$attempt"
          printf '%s\n' '3d11fc38f584b19604039c26618285798bff01e7df241f3f91a70a1e19ec5667  request.json' | sha256sum -c -
          ./drone farming:collect request.json nominal > result.json 2> result.stderr
          test ! -s result.stderr
          bun -e '
            import { createHash } from "node:crypto";
            import { readFileSync } from "node:fs";
            const hash = bytes => createHash("sha256").update(bytes).digest("hex");
            const read = path => readFileSync(path);
            const raw = read("result.json");
            if (raw.length > 16777216 || raw.toString().split("\n").length !== 2) throw new Error("Invalid collection wire");
            const p = JSON.parse(raw), r = p.record, input = read("request.json");
            if (p.version !== 1 || p.kind !== "farming-synthetic-collection-delivery" || r.outcome.status !== "completed" || r.outcome.boardNeutral !== true || r.outcome.lastMissionResult.state !== "completed" || r.outcome.lastMissionResult.targetM !== null || r.outcome.captures < 1 || r.layer.cells.length !== 256 || r.layer.parcels.length !== 2 || r.layer.observedAreaM2 <= 0 || r.source.sha256 !== hash(input) || r.source.byteLength !== input.length) throw new Error("Invalid collection result");
            if (r.synthetic !== true || [r.ownershipVerified,r.geometryVerified,r.physicalFlightEnabled,r.physicalCalibrationVerified,r.physicalAgronomyVerified,r.dispatchPerformed,r.operationalMissionCompleted,r.fullSensorReplayPerformed].some(v => v !== false)) throw new Error("Invalid simulation evidence");
            const producerBytes = read("nominal/attempt/producer.json"), producer = JSON.parse(producerBytes);
            if (producer.implementation.method !== "observed-standalone-process-executable" || producer.process.standalone !== true || producer.process.executable.sha256 !== hash(read("drone")) || producer.process.executable.byteLength !== read("drone").length || producer.authenticatedExecution !== false || producer.loadedGraphAttested !== false || producer.observationsUnchanged !== true || producer.observationInterval !== "before-collection-and-after-dataset-readback" || r.producer.sha256 !== hash(producerBytes) || r.producer.byteLength !== producerBytes.length) throw new Error("Invalid producer observation");
            const markerBytes = read("nominal/attempt/manifest.json"), marker = JSON.parse(markerBytes);
            if (p.attempt.manifestPath !== "attempt/manifest.json" || p.attempt.manifestByteLength !== markerBytes.length || p.attempt.manifestSha256 !== hash(markerBytes) || marker.files.map(f => f.path).join(",") !== "request.json,producer.json,result.json,dataset-manifest.json") throw new Error("Invalid attempt marker");
            for (const f of marker.files) { const b = read(`nominal/attempt/${f.path}`); if (b.length !== f.byteLength || hash(b) !== f.sha256) throw new Error("Changed attempt file"); }
            const datasetBytes = read("nominal/dataset/manifest.json"), dataset = JSON.parse(datasetBytes), recording = read("nominal/dataset/recording.json");
            if (!read("nominal/attempt/dataset-manifest.json").equals(datasetBytes) || r.dataset.manifestSha256 !== hash(datasetBytes) || r.dataset.manifestByteLength !== datasetBytes.length || r.dataset.recordingSha256 !== hash(recording) || r.dataset.recordingByteLength !== recording.length || JSON.stringify(JSON.parse(read("nominal/attempt/result.json"))) !== JSON.stringify(r) || JSON.stringify(JSON.parse(read("nominal/dataset/layer.json"))) !== JSON.stringify(r.layer)) throw new Error("Changed dataset identity");
            for (const f of dataset.files) { const b = read(`nominal/dataset/${f.path}`); if (b.length !== f.bytes || hash(b) !== f.sha256) throw new Error("Changed raw dataset file"); }
            const short = JSON.parse(input); short.simulation.seconds = 8;
            await Bun.write("short-request.json", JSON.stringify(short));
          '
          set +e
          ./drone farming:collect short-request.json incomplete > incomplete.json 2> incomplete.stderr
          status=$?
          set -e
          test "$status" -eq 2
          test ! -s incomplete.stderr
          bun -e 'const p = await Bun.file("incomplete.json").json(), r = p.record; if (r.outcome.status !== "incomplete" || r.outcome.boardNeutral !== true || r.outcome.captures !== 0 || r.outcome.lastMissionResult.state !== "running" || r.outcome.lastMissionResult.targetM === null || r.layer.cells.length !== 256 || r.layer.observedAreaM2 !== 0 || r.layer.meanNdvi !== null || r.operationalMissionCompleted !== false || r.layer.cells.some(c => c.source !== null || c.ndvi !== null || c.reason !== "uncovered")) throw new Error("Invalid noncompleted evidence"); if (!(await Bun.file("incomplete/attempt/manifest.json").exists())) throw new Error("Missing noncompleted attempt")'
          printf '%s\n' '{"version":1}' > invalid.json
          set +e
          ./drone farming:collect invalid.json rejected > invalid.stdout 2> invalid.stderr
          status=$?
          set -e
          test "$status" -eq 1
          test ! -s invalid.stdout
          test ! -e rejected
          printf '%s\n' 'Farming collection preview unavailable: invalid declaration, rejected collection or output failure' > expected.stderr
          cmp expected.stderr invalid.stderr
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone agriculture:simulate --visit ci-field --output "$RUNNER_TEMP/agriculture-collected"
        working-directory: ${{ runner.temp }}
      - name: Reprocess the full calibrated field layer through a stdout pipe
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/storage/runtime-build/cli/drone" agriculture:process "$RUNNER_TEMP/agriculture-collected/recording.json" --output "$RUNNER_TEMP/agriculture-processed" | bun -e 'const result = await Bun.stdin.json(); if (result.layer.cells.length !== 256 || result.layer.parcels.length !== 2 || result.layer.physicalAgronomyVerified !== false) throw new Error("Invalid calibrated field layer"); console.log("Verified full field layer through stdout pipe")'
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone agriculture:observe "$RUNNER_TEMP/agriculture-collected/recording.json" --id ci-selection --animal selected-light-animal --capture photo-0016 --x 60 --y 33 --observer ci-operator --observed-at 2026-10-18T12:00:00.000Z --note "Explicit synthetic source-pixel declaration, identity unverified" --output "$RUNNER_TEMP/agriculture-observed"
        working-directory: ${{ runner.temp }}
      - name: Preserve source-bound declarations through standalone reprocessing
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/storage/runtime-build/cli/drone" agriculture:process "$RUNNER_TEMP/agriculture-observed/recording.json" --observations "$RUNNER_TEMP/agriculture-observed/livestock-observations.json" --output "$RUNNER_TEMP/agriculture-retained" | bun -e 'const result = await Bun.stdin.json(); if (result.observations !== 1) throw new Error("Lost explicit animal declaration"); const records = await Bun.file(`${result.dataset.directory}/livestock-observations.json`).json(); if (records[0].captureId !== "photo-0016" || records[0].identityAuthenticated !== false || records[0].physicalAnimalVerified !== false) throw new Error("Changed source-bound declaration"); console.log("Verified explicit declaration retention")'
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone agriculture:simulate --scenario band-skew
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone agriculture:simulate --scenario irradiance-loss
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone application:plan "$GITHUB_WORKSPACE/examples/application-sprayer.json"
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone application:simulate
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone application:simulate --mode apply --authorize-implement --output "$RUNNER_TEMP/application-sprayer"
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone application:simulate --implement spreader --mode apply --authorize-implement --output "$RUNNER_TEMP/application-spreader"
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone application:process "$RUNNER_TEMP/application-sprayer/recording.json" --output "$RUNNER_TEMP/application-reprocessed"
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone application:replay "$RUNNER_TEMP/application-spreader/recording.json"
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone application:simulate --mode apply --authorize-implement --scenario host-loss
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone application:simulate --mode apply --authorize-implement --scenario master-stuck
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone public-safety:plan "$GITHUB_WORKSPACE/examples/public-safety.json"
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone public-safety:simulate --output "$RUNNER_TEMP/public-safety-collected"
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone public-safety:replay "$RUNNER_TEMP/public-safety-collected/recording.json" --at-ms 600
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone public-safety:simulate --purpose fire-observation --scenario link-loss
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone public-safety:simulate --purpose disaster-assessment --scenario boundary-change
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone public-safety:simulate --scenario wrong-ack
        working-directory: ${{ runner.temp }}
  workspace-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: cp .env.example .env
      - run: ./buddy key:generate
      - name: Qualify the rendered workspace with real native accounts and routes
        shell: bash
        env:
          WORKSPACE_BROWSER_QA: 'true'
          WORKSPACE_BROWSER_EVIDENCE: ${{ runner.temp }}/workspace-browser-evidence
        run: |
          set -euo pipefail
          export BROWSE_BROWSER="$(command -v google-chrome)"
          test -x "$BROWSE_BROWSER"
          bun test tests/unit/public-safety-workspace-browser.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-browser-evidence
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/workspace-browser-evidence/*.png
            ${{ runner.temp }}/workspace-browser-evidence/compiled.html
  execution-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: cp .env.example .env
      - run: ./buddy key:generate
      - name: Qualify rendered execution with native authority and a genuine Worker
        shell: bash
        env:
          EXECUTION_BROWSER_QA: 'true'
          EXECUTION_BROWSER_EVIDENCE: ${{ runner.temp }}/execution-browser-evidence
        run: |
          set -euo pipefail
          export BROWSE_BROWSER="$(command -v google-chrome)"
          test -x "$BROWSE_BROWSER"
          bun test tests/unit/public-safety-execution-browser.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: execution-browser-evidence
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/execution-browser-evidence/*.png
            ${{ runner.temp }}/execution-browser-evidence/compiled.html
  purge-namespace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: cp .env.example .env
      - run: ./buddy key:generate
      - name: Qualify actual zero-byte and partial ENOSPC writes with fresh runtime recovery
        shell: bash
        run: |
          set -euo pipefail
          sudo --non-interactive env RUNTIME_HOST_ENOSPC_TEST=1 RUNTIME_HOST_ENOSPC_EVIDENCE="$RUNNER_TEMP/runtime-host-enospc" unshare --mount --propagation private --fork "$(command -v bun)" test ./tests/integration/runtime-host-storage.test.ts
      - name: Make the owned filesystem campaign artifacts readable by the runner
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if sudo --non-interactive test -d "$RUNNER_TEMP/runtime-host-enospc"; then
            sudo --non-interactive chown -R --no-dereference "$(id -u):$(id -g)" "$RUNNER_TEMP/runtime-host-enospc"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-host-enospc-evidence
          if-no-files-found: ignore
          retention-days: 7
          path: ${{ runner.temp }}/runtime-host-enospc
      - name: Qualify accepted purge with real process and mount isolation
        run: sudo --non-interactive env PUBLIC_SAFETY_PURGE_NAMESPACE_TEST=1 unshare --fork --pid --mount-proc "$(command -v bun)" test ./tests/integration/public-safety-purge.test.ts
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the recorded compiler and SDK
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi.tar.xz -o "$RUNNER_TEMP/arm.tar.xz"
          echo "8f6903f8ceb084d9227b9ef991490413014d991874a1e34074443c2a72b14dbd  $RUNNER_TEMP/arm.tar.xz" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/arm.tar.xz" -C "$RUNNER_TEMP"
          git clone --depth 1 --branch 2.3.1 https://github.com/raspberrypi/pico-sdk.git "$RUNNER_TEMP/pico-sdk"
      - name: Cross-compile the neutral-only Pico 2 image
        shell: bash
        run: |
          set -euo pipefail
          export PICO_SDK_PATH="$RUNNER_TEMP/pico-sdk"
          export PICO_TOOLCHAIN_PATH="$RUNNER_TEMP/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi"
          cmake -S firmware/runtime -B storage/runtime-build/pico2 -DDRONE_PICO2=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build storage/runtime-build/pico2 --parallel 2
          "$PICO_TOOLCHAIN_PATH/bin/arm-none-eabi-size" storage/runtime-build/pico2/drone_runtime.elf
          cmake -S firmware/runtime -B storage/runtime-build/pico2-sensors -DDRONE_PICO2=ON -DDRONE_SENSOR_BENCH=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build storage/runtime-build/pico2-sensors --parallel 2
          "$PICO_TOOLCHAIN_PATH/bin/arm-none-eabi-size" storage/runtime-build/pico2-sensors/drone_runtime.elf
      - uses: actions/upload-artifact@v4
        with:
          name: pico2-neutral-only-bench
          path: |
            storage/runtime-build/pico2/drone_runtime.uf2
            storage/runtime-build/pico2/drone_runtime.elf
            storage/runtime-build/pico2/drone_runtime.elf.map
            storage/runtime-build/pico2/**/*.su
      - uses: actions/upload-artifact@v4
        with:
          name: pico2-sensor-bench
          path: |
            storage/runtime-build/pico2-sensors/drone_runtime.uf2
            storage/runtime-build/pico2-sensors/drone_runtime.elf
            storage/runtime-build/pico2-sensors/drone_runtime.elf.map
            storage/runtime-build/pico2-sensors/**/*.su
