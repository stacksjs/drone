name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: cp .env.example .env
      - run: ./buddy key:generate
      - run: ./buddy lint
      - run: ./buddy typecheck
      - run: bun run typecheck:runtime
      - run: bun run typecheck:views
      - run: bun run roadmap:check
      - run: bun run parity:check
      - run: python3 -m py_compile resources/functions/drone/camera/imx500_worker.py
      - run: python3 -m unittest discover -s tests/hardware
      - run: ./buddy test
      - run: bun run runtime:cli
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone runtime:bench --project "$GITHUB_WORKSPACE" --ticks 100 --fault deadline
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone sensors:replay "$GITHUB_WORKSPACE/tests/fixtures/sensors/bench-v1.json" --at-ms 500
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone estimator:replay "$GITHUB_WORKSPACE/tests/fixtures/estimation/motion-v1.json" --at-ms 6040
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone controls:simulate --scenario hover --seconds 3
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone authority:simulate --scenario pi-loss --seconds 4
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone drivers:bench --driver ardupilot --drop-first-ack
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone drivers:bench --driver px4 --signed --drop-first-ack
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone payloads:bench
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone payloads:capture --driver replay --output "$RUNNER_TEMP/payload-capture"
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone diagnostics:record --project "$GITHUB_WORKSPACE" --ticks 20 --fault deadline --output "$RUNNER_TEMP/runtime-recording"
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone diagnostics:replay "$RUNNER_TEMP/runtime-recording/journal.ndjson"
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone diagnostics:export "$RUNNER_TEMP/runtime-recording/journal.ndjson" --output "$RUNNER_TEMP/runtime-export"
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone missions:validate "$GITHUB_WORKSPACE/examples/local-mission.json"
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone missions:simulate --scenario recovery --output "$RUNNER_TEMP/mission-recording"
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone missions:replay "$RUNNER_TEMP/mission-recording/mission.json" --at-ms 6000
        working-directory: ${{ runner.temp }}
      - name: Exercise portable mission-process recovery outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          "$GITHUB_WORKSPACE/storage/runtime-build/cli/drone" missions:checkpoint "$RUNNER_TEMP/mission-recording/mission.json" --at-ms 4980 --output "$RUNNER_TEMP/mission-checkpoint"
          bun -e 'const root = process.env.RUNNER_TEMP; const trace = await Bun.file(`${root}/mission-recording/mission.json`).json(); const observation = trace.rows.find(row => row.observation.nowMs === 6000).observation; await Bun.write(`${root}/mission-observation.json`, JSON.stringify(observation))'
          "$GITHUB_WORKSPACE/storage/runtime-build/cli/drone" missions:recover "$RUNNER_TEMP/mission-checkpoint/mission.json" "$RUNNER_TEMP/mission-observation.json" --output "$RUNNER_TEMP/mission-recovered"
          "$GITHUB_WORKSPACE/storage/runtime-build/cli/drone" missions:replay "$RUNNER_TEMP/mission-recovered/mission.json"
          bun -e 'const root = process.env.RUNNER_TEMP; const trace = await Bun.file(`${root}/mission-recording/mission.json`).json(); const observation = trace.rows.find(row => row.observation.nowMs === 6020).observation; await Bun.write(`${root}/mission-resume-observation.json`, JSON.stringify(observation))'
          "$GITHUB_WORKSPACE/storage/runtime-build/cli/drone" missions:resume "$RUNNER_TEMP/mission-recovered/mission.json" "$RUNNER_TEMP/mission-resume-observation.json" --output "$RUNNER_TEMP/mission-resumed"
          "$GITHUB_WORKSPACE/storage/runtime-build/cli/drone" missions:replay "$RUNNER_TEMP/mission-resumed/mission.json"
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone navigation:simulate --scenario avoid-land
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone navigation:simulate --scenario replan
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone antenna:bench --scenario nominal --seconds 10
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone air:simulate --scenario nominal --seconds 120
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone ground:simulate --scenario logistics --seconds 120
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone surface:simulate --scenario nominal --seconds 120 --survey "$RUNNER_TEMP/surface-survey.json" --position-sigma 1 --clock-sigma 2 --attitude-sigma 0.002
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone subsea:simulate --scenario nominal --seconds 120 --inspection "$RUNNER_TEMP/subsea-inspection.json"
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone subsea:simulate --scenario tether-loss --seconds 120
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone vision:validate "$GITHUB_WORKSPACE/examples/vision-calibration.json"
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone vision:simulate --scenario follow
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone vision:simulate --scenario identity-drift
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone mapping:plan --config "$GITHUB_WORKSPACE/examples/survey.json"
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone mapping:simulate --scenario nominal --output "$RUNNER_TEMP/mapping-dataset"
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone mapping:simulate --scenario crosshatch
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone mapping:simulate --scenario camera-loss
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone volumes:demo --scenario reference-comparison --output "$RUNNER_TEMP/volume-pyramid"
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone volumes:process "$GITHUB_WORKSPACE/examples/stockpile/request.json"
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone volumes:import "$GITHUB_WORKSPACE/examples/stockpile/surface.asc" --format asc --metadata "$GITHUB_WORKSPACE/examples/stockpile/metadata.json" --measurement "$GITHUB_WORKSPACE/examples/stockpile/measurement.json" --output "$RUNNER_TEMP/volume-grid"
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone inspection:plan "$GITHUB_WORKSPACE/examples/inspection.json"
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone inspection:simulate --visit before --output "$RUNNER_TEMP/inspection-before"
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone inspection:simulate --scenario wind --visit after --output "$RUNNER_TEMP/inspection-after"
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone inspection:compare "$RUNNER_TEMP/inspection-before/recording.json" "$RUNNER_TEMP/inspection-after/recording.json"
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone inspection:review "$RUNNER_TEMP/inspection-before/recording.json" --id ci-review --capture capture-0001 --reviewer ci-operator --reviewed-at 2026-10-18T12:00:00.000Z --decision needs-follow-up --modality thermal --x 48 --y 36 --note "Synthetic CI declaration, no human defect verification" --output "$RUNNER_TEMP/inspection-reviewed"
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone inspection:simulate --scenario structure-motion
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone agriculture:plan "$GITHUB_WORKSPACE/examples/agriculture.json"
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone agriculture:simulate --visit ci-field --output "$RUNNER_TEMP/agriculture-collected"
        working-directory: ${{ runner.temp }}
      - name: Reprocess the full calibrated field layer through a stdout pipe
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/storage/runtime-build/cli/drone" agriculture:process "$RUNNER_TEMP/agriculture-collected/recording.json" --output "$RUNNER_TEMP/agriculture-processed" | bun -e 'const result = await Bun.stdin.json(); if (result.layer.cells.length !== 256 || result.layer.parcels.length !== 2 || result.layer.physicalAgronomyVerified !== false) throw new Error("Invalid calibrated field layer"); console.log("Verified full field layer through stdout pipe")'
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone agriculture:observe "$RUNNER_TEMP/agriculture-collected/recording.json" --id ci-selection --animal selected-light-animal --capture photo-0016 --x 60 --y 33 --observer ci-operator --observed-at 2026-10-18T12:00:00.000Z --note "Explicit synthetic source-pixel declaration, identity unverified" --output "$RUNNER_TEMP/agriculture-observed"
        working-directory: ${{ runner.temp }}
      - name: Preserve source-bound declarations through standalone reprocessing
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/storage/runtime-build/cli/drone" agriculture:process "$RUNNER_TEMP/agriculture-observed/recording.json" --observations "$RUNNER_TEMP/agriculture-observed/livestock-observations.json" --output "$RUNNER_TEMP/agriculture-retained" | bun -e 'const result = await Bun.stdin.json(); if (result.observations !== 1) throw new Error("Lost explicit animal declaration"); const records = await Bun.file(`${result.dataset.directory}/livestock-observations.json`).json(); if (records[0].captureId !== "photo-0016" || records[0].identityAuthenticated !== false || records[0].physicalAnimalVerified !== false) throw new Error("Changed source-bound declaration"); console.log("Verified explicit declaration retention")'
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone agriculture:simulate --scenario band-skew
        working-directory: ${{ runner.temp }}
      - run: $GITHUB_WORKSPACE/storage/runtime-build/cli/drone agriculture:simulate --scenario irradiance-loss
        working-directory: ${{ runner.temp }}
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the recorded compiler and SDK
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi.tar.xz -o "$RUNNER_TEMP/arm.tar.xz"
          echo "8f6903f8ceb084d9227b9ef991490413014d991874a1e34074443c2a72b14dbd  $RUNNER_TEMP/arm.tar.xz" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/arm.tar.xz" -C "$RUNNER_TEMP"
          git clone --depth 1 --branch 2.3.1 https://github.com/raspberrypi/pico-sdk.git "$RUNNER_TEMP/pico-sdk"
      - name: Cross-compile the neutral-only Pico 2 image
        shell: bash
        run: |
          set -euo pipefail
          export PICO_SDK_PATH="$RUNNER_TEMP/pico-sdk"
          export PICO_TOOLCHAIN_PATH="$RUNNER_TEMP/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi"
          cmake -S firmware/runtime -B storage/runtime-build/pico2 -DDRONE_PICO2=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build storage/runtime-build/pico2 --parallel 2
          "$PICO_TOOLCHAIN_PATH/bin/arm-none-eabi-size" storage/runtime-build/pico2/drone_runtime.elf
          cmake -S firmware/runtime -B storage/runtime-build/pico2-sensors -DDRONE_PICO2=ON -DDRONE_SENSOR_BENCH=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build storage/runtime-build/pico2-sensors --parallel 2
          "$PICO_TOOLCHAIN_PATH/bin/arm-none-eabi-size" storage/runtime-build/pico2-sensors/drone_runtime.elf
      - uses: actions/upload-artifact@v4
        with:
          name: pico2-neutral-only-bench
          path: |
            storage/runtime-build/pico2/drone_runtime.uf2
            storage/runtime-build/pico2/drone_runtime.elf
            storage/runtime-build/pico2/drone_runtime.elf.map
            storage/runtime-build/pico2/**/*.su
      - uses: actions/upload-artifact@v4
        with:
          name: pico2-sensor-bench
          path: |
            storage/runtime-build/pico2-sensors/drone_runtime.uf2
            storage/runtime-build/pico2-sensors/drone_runtime.elf
            storage/runtime-build/pico2-sensors/drone_runtime.elf.map
            storage/runtime-build/pico2-sensors/**/*.su
