# Research branch only. Never merge this workflow replacement into main.
name: Native Chrome startup capability probe (not product qualification)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-startup-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: cp .env.example .env
      - run: ./buddy key:generate
      - run: ./buddy lint
      - run: bun run tsc --noEmit -p tests/tsconfig.browser-startup-probe.json
      - name: Run 24 native startup trials without application imports
        working-directory: ${{ runner.temp }}
        shell: bash
        env:
          PROBE_SOURCE_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          export BROWSE_BROWSER="$(command -v google-chrome)"
          test -x "$BROWSE_BROWSER"
          printf '%s\n' '# Empty config for native capability research' > "$RUNNER_TEMP/native-probe-bunfig.toml"
          bun --no-install --config="$RUNNER_TEMP/native-probe-bunfig.toml" --no-env-file "$GITHUB_WORKSPACE/scripts/debug/browser-startup-probe.ts" "$RUNNER_TEMP/browser-startup-probe" "$RUNNER_TEMP/browser-startup-profiles"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-startup-capability-only
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/browser-startup-probe/manifest.json
            ${{ runner.temp }}/browser-startup-probe/trial-*.json
            ${{ runner.temp }}/browser-startup-probe/trial-*.startup-stderr.log
