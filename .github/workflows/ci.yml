# Research branch only. Never merge this workflow replacement into main.
name: Linux passive TCP observations (not product qualification)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tcp-passive-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: cp .env.example .env
      - run: ./buddy key:generate
      - run: ./buddy lint
      - run: bun run typecheck:runtime
      - name: Preserve original TCP tests and bounded passive queue observations
        env:
          DRONE_TCP_PRESSURE_OBSERVATIONS: '1'
        run: bun test ./tests/unit/driver-tcp.test.ts
