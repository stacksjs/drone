name: CI
run-name: Owned vehicle lifecycle focused research
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: cp .env.example .env
      - name: Record native runtime identity
        run: |
          bun --version
          sha256sum "$(command -v bun)"
          git rev-parse HEAD
      - name: Exercise the public lifecycle boundary
        run: bun test ./tests/unit/vehicle-lifecycle.test.ts
      - name: Native Pickier lint
        run: ./buddy lint
      - name: Application types
        run: ./buddy typecheck
      - name: Runtime types
        run: bun run typecheck:runtime
